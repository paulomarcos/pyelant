[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyelant"
dynamic = ["version"]
description = "Translate text from the clipboard, microphone or command line with a hotkey. Uses Google Translate and copies the result for pasting."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Paulo Marcos", email = "paulomarcos@me.com" }]
requires-python = ">=3.10"
keywords = [
    "translation",
    "translator",
    "translate",
    "google-translate",
    "clipboard",
    "hotkey",
    "speech-recognition",
    "speech-to-text",
    "voice",
    "cli",
    "productivity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "desktop-notifier>=6.0",
    "googletrans>=4.0.2",
    "pynput>=1.8",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
mic = [
    "PyAudio>=0.2.14",
    "SpeechRecognition>=3.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
pyelant = "pyelant.__main__:main"

[project.urls]
Homepage = "https://github.com/paulomarcos/pyelant"
Documentation = "https://github.com/paulomarcos/pyelant#readme"
Source = "https://github.com/paulomarcos/pyelant"
Changelog = "https://github.com/paulomarcos/pyelant/blob/master/CHANGELOG.md"
Issues = "https://github.com/paulomarcos/pyelant/issues"

[tool.hatch.version]
path = "pyelant/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["pyelant", "tests", "README.md", "CHANGELOG.md", "LICENSE.txt"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = ["network: tests that call the real Google Translate service"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF"]
